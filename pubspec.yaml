name: fx_desktop
description: Desktop-first Flutter components and CSS-like layout contracts for Xojo-style UI design.
version: 0.4.0
homepage: https://github.com/jedt3d/FxDesktop
repository: https://github.com/jedt3d/FxDesktop
issue_tracker: https://github.com/jedt3d/FxDesktop/issues

environment:
  sdk: ^3.11.5
  flutter: ">=3.35.0"

platforms:
  linux:
  macos:
  web:
  windows:

topics:
  - desktop
  - flutter
  - layout
  - xojo

screenshots:
  - description: "FxDesktop localization gallery in English."
    path: doc/screenshots/v0.4.0/localization/fxdesktop-localized-en.png
  - description: "FxDesktop localization gallery in Thai."
    path: doc/screenshots/v0.4.0/localization/fxdesktop-localized-th.png
  - description: "FxDesktop localization gallery in Japanese."
    path: doc/screenshots/v0.4.0/localization/fxdesktop-localized-ja.png
  - description: "FxDesktop localization gallery in Nepali."
    path: doc/screenshots/v0.4.0/localization/fxdesktop-localized-ne.png
  - description: "FxDesktop localization gallery right-to-left layout smoke view."
    path: doc/screenshots/v0.4.0/localization/fxdesktop-localized-rtl-smoke.png
  - description: "FxDesktop ListBox/Grid lookup cells with custom renderers."
    path: doc/screenshots/v0.3.6/fxdesktop-v0.3.6-lookup-renderers.png
  - description: "FxDesktop hosted multi-column database lookup overlay."
    path: doc/screenshots/v0.3.6/fxdesktop-v0.3.6-db-lookup-overlay.png
  - description: "FxDesktop masked editor and cell action button."
    path: doc/screenshots/v0.3.6/fxdesktop-v0.3.6-masked-action-editor.png

dependencies:
  flexiblebox: ^1.0.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_layout_grid: ^2.0.8
  intl: ^0.20.2
  two_dimensional_scrollables: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dartdoc: ^9.0.2

flutter:
  generate: true
